<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chess vs Bot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="common.js"></script>
</head>
<body>
<div class="game-container">
    <h1>♞ CHESS vs BOT</h1>
    <div class="sub">Tap a white piece → green circles show where it can move → tap a green circle to move</div>

    <div id="board"></div>

    <div class="stats-panel">
        <div class="info-card">🎯 TURN: <span id="turnIndicator">Your turn</span></div>
        <div class="info-card">🏆 STATUS: <span id="statusText">Playing</span></div>
    </div>

    <div class="center">
        <button id="resetBtn">🔄 New Game</button>
    </div>
</div>

<script>
    let game = new Chess();
    const boardDiv = document.getElementById('board');
    const turnIndicator = document.getElementById('turnIndicator');
    const statusText = document.getElementById('statusText');
    let selectedPiece = null;      // { row, col }
    let legalTargets = [];          // array of [row, col]
    let waitingBot = false;

    function updateUI() {
        if (game.game_over()) {
            if (game.in_checkmate()) {
                const loser = game.turn();
                const winner = loser === 'w' ? 'Black' : 'White';
                statusText.innerText = `${winner} wins!`;
                turnIndicator.innerText = "Game over";
            } else if (game.in_stalemate()) {
                statusText.innerText = "Stalemate";
                turnIndicator.innerText = "Game over";
            } else {
                statusText.innerText = "Game over";
                turnIndicator.innerText = "Game over";
            }
            return;
        }
        const playerTurn = (game.turn() === 'w');
        turnIndicator.innerText = playerTurn ? "✅ YOUR TURN" : "🤖 BOT'S TURN...";
        statusText.innerText = game.in_check() ? "⚠️ CHECK!" : "Playing";
    }

    function clearHighlights() {
        for (let i = 0; i < boardDiv.children.length; i++) {
            boardDiv.children[i].classList.remove('has-legal-move');
            boardDiv.children[i].classList.remove('selected');
        }
    }

    function redraw() {
        drawBoard(game, boardDiv, onSquareClick);
        if (selectedPiece) {
            const idx = selectedPiece.row * 8 + selectedPiece.col;
            if (boardDiv.children[idx]) boardDiv.children[idx].classList.add('selected');
        }
        if (legalTargets.length) {
            highlightSquares(boardDiv, legalTargets);
        }
        updateUI();
    }

    function onSquareClick(row, col) {
        if (game.game_over()) return;
        if (waitingBot) {
            turnIndicator.innerText = "Wait for bot...";
            return;
        }
        if (game.turn() !== 'w') {
            turnIndicator.innerText = "Not your turn";
            setTimeout(updateUI, 800);
            return;
        }

        // If a piece is already selected
        if (selectedPiece) {
            const isTarget = legalTargets.some(([r,c]) => r === row && c === col);
            if (isTarget) {
                const fromRow = selectedPiece.row;
                const fromCol = selectedPiece.col;
                const from = String.fromCharCode(97 + fromCol) + (8 - fromRow);
                const to = String.fromCharCode(97 + col) + (8 - row);
                const move = game.move({ from, to, promotion: 'q' });
                if (move) {
                    selectedPiece = null;
                    legalTargets = [];
                    redraw();
                    updateUI();
                    if (!game.game_over() && game.turn() === 'b') {
                        waitingBot = true;
                        turnIndicator.innerText = "Bot thinking...";
                        setTimeout(() => makeBotMove(), 300);
                    }
                    return;
                }
            }
            // If clicked on non-target, clear selection
            clearHighlights();
            selectedPiece = null;
            legalTargets = [];
            // fall through to attempt new selection
        }

        // No selection: try to select a white piece
        const piece = game.get(row, col);
        if (piece && piece.color === 'w') {
            selectedPiece = { row, col };
            clearHighlights();
            const idx = row * 8 + col;
            if (boardDiv.children[idx]) boardDiv.children[idx].classList.add('selected');
            const fromAlg = String.fromCharCode(97 + col) + (8 - row);
            const moves = game.moves({ square: fromAlg, verbose: true });
            const targets = moves.map(m => {
                const toRow = 8 - parseInt(m.to[1]);
                const toCol = m.to.charCodeAt(0) - 97;
                return [toRow, toCol];
            });
            legalTargets = targets;
            if (targets.length) {
                highlightSquares(boardDiv, targets);
                statusText.innerText = "Tap a green circle to move";
                setTimeout(() => {
                    if (!game.game_over()) statusText.innerText = game.in_check() ? "⚠️ CHECK!" : "Playing";
                }, 1500);
            } else {
                statusText.innerText = "No legal moves for this piece";
                setTimeout(() => {
                    if (!game.game_over()) statusText.innerText = "Playing";
                }, 1000);
            }
        } else {
            statusText.innerText = "Select your piece (white)";
            setTimeout(() => {
                if (!game.game_over()) statusText.innerText = "Playing";
            }, 800);
        }
    }

    function makeBotMove() {
        if (game.game_over()) {
            waitingBot = false;
            return;
        }
        if (game.turn() !== 'b') {
            waitingBot = false;
            updateUI();
            return;
        }
        const moves = game.moves();
        if (!moves.length) {
            waitingBot = false;
            updateUI();
            return;
        }
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        game.move(randomMove);
        selectedPiece = null;
        legalTargets = [];
        redraw();
        waitingBot = false;
        updateUI();
        if (!game.game_over() && game.turn() === 'b') {
            waitingBot = true;
            setTimeout(makeBotMove, 200);
        }
    }

    function resetGame() {
        game = new Chess();
        selectedPiece = null;
        legalTargets = [];
        waitingBot = false;
        redraw();
        updateUI();
    }

    document.getElementById('resetBtn').addEventListener('click', resetGame);
    resetGame();
</script>
</body>
</html>
