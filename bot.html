<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♞ Chess vs Bot – Tap to Move</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="common.js"></script>
    <style>
        /* Additional style for green circle indicators */
        .square {
            position: relative;
        }
        .square.has-legal-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, #4caf50, #2e7d32);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🤖 CHESS vs BOT</h1>
    <div class="sub">Tap a white piece → green circles show legal moves → tap a circle to move</div>

    <div class="board-wrapper">
        <div id="board"></div>
    </div>

    <div class="stats-panel">
        <div class="info-card">🎯 TURN: <span id="turnIndicator">Your turn</span></div>
        <div class="info-card">🏆 STATUS: <span id="statusText">Playing</span></div>
    </div>

    <div class="center">
        <button id="resetBtn">🔄 New Game</button>
        <a href="index.html"><button>🏠 Home</button></a>
    </div>
</div>

<script>
    let game = new Chess();
    let boardDiv = document.getElementById('board');
    let turnIndicator = document.getElementById('turnIndicator');
    let statusText = document.getElementById('statusText');
    let selectedSquare = null;          // { row, col }
    let currentLegalTargets = [];       // array of [row, col]
    let waitingForBot = false;

    function updateUI() {
        if (game.game_over()) {
            if (game.in_checkmate()) {
                const loser = game.turn();
                const winner = loser === 'w' ? 'Black' : 'White';
                statusText.innerText = `${winner} wins by checkmate!`;
                turnIndicator.innerText = "Game over";
            } else if (game.in_stalemate()) {
                statusText.innerText = "Stalemate!";
                turnIndicator.innerText = "Game over";
            } else {
                statusText.innerText = "Game over";
                turnIndicator.innerText = "Game over";
            }
            return;
        }
        const isPlayerTurn = (game.turn() === 'w');
        turnIndicator.innerText = isPlayerTurn ? "✅ YOUR TURN" : "🤖 BOT'S TURN...";
        statusText.innerText = game.in_check() ? "⚠️ CHECK!" : "Playing";
    }

    function clearHighlights() {
        for (let i = 0; i < boardDiv.children.length; i++) {
            boardDiv.children[i].classList.remove('has-legal-move');
            boardDiv.children[i].classList.remove('selected');
        }
    }

    function redrawBoard() {
        drawBoard(game, boardDiv, onSquareClick);
        if (selectedSquare) {
            const idx = selectedSquare.row * 8 + selectedSquare.col;
            if (boardDiv.children[idx]) boardDiv.children[idx].classList.add('selected');
        }
        if (currentLegalTargets.length > 0) {
            highlightSquares(boardDiv, currentLegalTargets);
        }
        updateUI();
    }

    function onSquareClick(row, col) {
        if (game.game_over()) return;
        if (waitingForBot) {
            turnIndicator.innerText = "⏳ Wait for bot...";
            return;
        }
        const isPlayerTurn = (game.turn() === 'w');
        if (!isPlayerTurn) {
            turnIndicator.innerText = "⏳ Wait for bot...";
            setTimeout(updateUI, 800);
            return;
        }

        // If a piece is selected, check if click is on a legal target
        if (selectedSquare !== null) {
            const isLegal = currentLegalTargets.some(([r,c]) => r === row && c === col);
            if (isLegal) {
                const fromRow = selectedSquare.row;
                const fromCol = selectedSquare.col;
                const from = String.fromCharCode(97 + fromCol) + (8 - fromRow);
                const to = String.fromCharCode(97 + col) + (8 - row);
                const move = game.move({ from, to, promotion: 'q' });
                if (move) {
                    selectedSquare = null;
                    currentLegalTargets = [];
                    redrawBoard();
                    updateUI();
                    if (!game.game_over() && game.turn() === 'b') {
                        waitingForBot = true;
                        turnIndicator.innerText = "🤖 BOT'S TURN...";
                        setTimeout(makeBotMove, 300);
                    }
                    return;
                }
            }
            // If not legal, clear selection and treat as new attempt
            clearHighlights();
            selectedSquare = null;
            currentLegalTargets = [];
        }

        // No selection: try to select a white piece
        const piece = game.get(row, col);
        if (piece && piece.color === 'w') {
            selectedSquare = { row, col };
            clearHighlights();
            const idx = row * 8 + col;
            if (boardDiv.children[idx]) boardDiv.children[idx].classList.add('selected');
            const fromAlgebraic = String.fromCharCode(97 + col) + (8 - row);
            const moves = game.moves({ square: fromAlgebraic, verbose: true });
            const targets = moves.map(m => [8 - parseInt(m.to[1]), m.to.charCodeAt(0) - 97]);
            currentLegalTargets = targets;
            if (targets.length > 0) {
                highlightSquares(boardDiv, targets);
            } else {
                statusText.innerText = "No legal moves";
                setTimeout(() => { if (!game.game_over()) statusText.innerText = "Playing"; }, 800);
            }
        } else {
            statusText.innerText = "Select your piece";
            setTimeout(() => { if (!game.game_over()) statusText.innerText = "Playing"; }, 800);
        }
    }

    function makeBotMove() {
        if (game.game_over()) {
            waitingForBot = false;
            return;
        }
        if (game.turn() !== 'b') {
            waitingForBot = false;
            updateUI();
            return;
        }
        const moves = game.moves();
        if (moves.length === 0) {
            waitingForBot = false;
            updateUI();
            return;
        }
        const randomMove = moves[Math.floor(Math.random() * moves.length)];
        game.move(randomMove);
        selectedSquare = null;
        currentLegalTargets = [];
        redrawBoard();
        waitingForBot = false;
        updateUI();
        if (!game.game_over() && game.turn() === 'b') {
            waitingForBot = true;
            setTimeout(makeBotMove, 200);
        }
    }

    function resetGame() {
        game = new Chess();
        selectedSquare = null;
        currentLegalTargets = [];
        waitingForBot = false;
        redrawBoard();
        updateUI();
    }

    document.getElementById('resetBtn').addEventListener('click', resetGame);
    resetGame();
</script>
</body>
</html>
