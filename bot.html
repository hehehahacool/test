<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chess vs Bot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="common.js"></script>
</head>
<body>
<div class="game-container">
    <h1>🤖 CHESS vs BOT</h1>
    <div class="sub">you are white, bot is black</div>
    <div class="board-wrapper">
        <div id="board"></div>
    </div>
    <div class="stats-panel">
        <div class="info-card">🎯 TURN: <span id="turnIndicator">White to move</span></div>
        <div class="info-card">🏆 STATUS: <span id="statusText">Playing</span></div>
    </div>
    <div class="center">
        <button onclick="location.reload()">🔄 New Game</button>
        <a href="index.html"><button>🏠 Home</button></a>
    </div>
</div>

<script>
    let game = new Chess();
    let boardDiv = document.getElementById('board');
    let turnIndicator = document.getElementById('turnIndicator');
    let statusText = document.getElementById('statusText');
    let selectedSquare = null;

    function updateUI() {
        const turn = game.turn();
        turnIndicator.innerText = turn === 'w' ? "Your turn (White)" : "Bot thinking...";
        if (game.game_over()) {
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? "Black wins!" : "You win!";
                statusText.innerText = winner;
                turnIndicator.innerText = "Game over";
            } else if (game.in_stalemate()) statusText.innerText = "Stalemate!";
            else statusText.innerText = "Game over";
        } else {
            statusText.innerText = game.in_check() ? "CHECK!" : "Playing";
        }
    }

    function makeBotMove() {
        if (game.game_over()) return;
        if (game.turn() === 'b') {
            setTimeout(() => {
                const moves = game.moves();
                if (moves.length > 0) {
                    const randomMove = moves[Math.floor(Math.random() * moves.length)];
                    game.move(randomMove);
                    redrawBoard();
                    updateUI();
                    if (game.game_over()) return;
                    // after bot move, it's player's turn
                }
            }, 200);
        }
    }

    function redrawBoard() {
        drawBoard(game, boardDiv, onSquareClick);
        updateUI();
    }

    function onSquareClick(row, col) {
        if (game.game_over()) return;
        if (game.turn() !== 'w') {
            turnIndicator.innerText = "Wait for bot...";
            return;
        }
        if (selectedSquare === null) {
            const piece = game.get(row, col);
            if (piece && piece.color === 'w') {
                selectedSquare = { row, col };
                clearSelected(boardDiv);
                const idx = row*8+col;
                if (boardDiv.children[idx]) boardDiv.children[idx].classList.add('selected');
                const fromAlg = String.fromCharCode(97+col) + (8-row);
                const moves = game.moves({ square: fromAlg, verbose: true });
                const targets = moves.map(m => [8 - parseInt(m.to[1]), m.to.charCodeAt(0)-97]);
                highlightSquares(boardDiv, targets);
            } else {
                statusText.innerText = "Select your piece";
                setTimeout(() => { if(!game.game_over()) statusText.innerText = "Playing"; }, 800);
            }
        } else {
            const from = String.fromCharCode(97+selectedSquare.col) + (8-selectedSquare.row);
            const to = String.fromCharCode(97+col) + (8-row);
            const moveObj = game.move({ from, to, promotion: 'q' });
            if (moveObj) {
                selectedSquare = null;
                redrawBoard();
                makeBotMove();
            } else {
                statusText.innerText = "Invalid move";
                selectedSquare = null;
                redrawBoard();
                setTimeout(() => { if(!game.game_over()) statusText.innerText = "Playing"; }, 800);
            }
        }
    }

    // initial draw
    redrawBoard();
    // if bot starts? no, white (player) starts, so no initial bot move.
</script>
</body>
</html>
