<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTFLIX – Stream After Dark</title>
    <style>
        body {
            background: #05050a;
            color: #c0c0e0;
            font-family: 'Courier New', monospace;
            max-width: 1000px;
            margin: 1rem auto;
            padding: 1rem;
        }
        h1 {
            color: #c084fc;
            font-size: 2.4rem;
        }
        .stats {
            background: #0a0a14;
            padding: 0.7rem 1.2rem;
            border-radius: 16px;
            display: flex;
            gap: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .stat {
            background: #15102a;
            padding: 0.3rem 1rem;
            border-radius: 20px;
        }
        .show-card {
            background: #0c0c18;
            border-left: 4px solid #a855f7;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 12px;
        }
        .show-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d8b4fe;
        }
        button {
            background: #4a1d6d;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            margin: 0.3rem 0.5rem 0.3rem 0;
            border-radius: 24px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover {
            background: #6a2d8d;
        }
        .log {
            background: #080810;
            border: 1px solid #2a1a4a;
            padding: 0.9rem;
            margin-top: 1.5rem;
            border-radius: 12px;
            max-height: 260px;
            overflow-y: auto;
        }
        .log p {
            margin: 0.4rem 0;
            border-bottom: 1px solid #1a1a2e;
            padding-bottom: 0.3rem;
        }
        input, textarea {
            background: #0a0a14;
            border: 1px solid #3a2a5a;
            color: #d8b4fe;
            padding: 0.6rem;
            width: 100%;
            margin-bottom: 8px;
            border-radius: 8px;
        }
        .win {
            color: #a3e635;
        }
        .lose {
            color: #ff6b9d;
        }
        h3 {
            color: #c084fc;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>🌙 NIGHTFLIX</h1>
    <p><i>"Stream after dark. Regret by dawn."</i></p>

    <div class="stats">
        <div class="stat">🌙 Sanity: <span id="sanity">6</span>/10</div>
        <div class="stat">🍿 Binge Streak: <span id="streak">0</span>/4</div>
        <div class="stat">📺 Watched: <span id="watchedCount">0</span></div>
    </div>

    <div id="showList"></div>

    <div class="log" id="log">
        <p>🎬 Welcome to NIGHTFLIX!</p>
        <p>💀 Click a show below to start watching.</p>
    </div>

    <div class="add-show">
        <h3>➕ ADD YOUR OWN SHOW</h3>
        <input type="text" id="newShowTitle" placeholder="Show title">
        <textarea id="newShowDesc" rows="2" placeholder="Description"></textarea>
        <input type="text" id="newShowChoiceA" placeholder="Choice A (e.g. '🐱 Pet the cat')">
        <input type="text" id="newOutcomeA" placeholder="Outcome A (e.g. 'The cat purrs. Good episode!')">
        <input type="text" id="newShowChoiceB" placeholder="Choice B (e.g. '😾 Ignore the cat')">
        <input type="text" id="newOutcomeB" placeholder="Outcome B (e.g. 'The cat is angry. Bad ending.')">
        <button id="addShowBtn">🌙 ADD TO NIGHTFLIX</button>
    </div>

    <script>
        // SIMPLIFIED SHOWS DATABASE
        let showsLibrary = [
            {
                title: "Stranger Nights",
                desc: "Teens hunt a shadow that steals socks.",
                choices: [
                    { text: "💨 Turn on the fan", outcome: "The shadow vanishes! Episode saved.", sanityDelta: 0, success: true },
                    { text: "🚪 Just leave", outcome: "You abandon the show. Weak ending.", sanityDelta: -1, success: false }
                ]
            },
            {
                title: "The Crown't",
                desc: "A queen who forgets what year it is.",
                choices: [
                    { text: "👑 Check the notes", outcome: "Advisor helps her. Success!", sanityDelta: 0, success: true },
                    { text: "😂 Laugh at her", outcome: "She gets angry. You feel bad.", sanityDelta: -1, success: false }
                ]
            },
            {
                title: "The Mandalorian't",
                desc: "A bounty hunter with a kitchen strainer for a helmet.",
                choices: [
                    { text: "🍝 Strain pasta", outcome: "He helps you cook. Wholesome!", sanityDelta: 0, success: true },
                    { text: "🤦 Facepalm", outcome: "You cringe too hard. Sanity drops.", sanityDelta: -1, success: false }
                ]
            },
            {
                title: "Squid Game But Soggy",
                desc: "Red Light, Green Light with wet cereal.",
                choices: [
                    { text: "🥣 Eat quickly", outcome: "You survive! Gross but effective.", sanityDelta: 0, success: true },
                    { text: "😖 Refuse", outcome: "Eliminated. The cereal wins.", sanityDelta: -1, success: false }
                ]
            },
            {
                title: "Bridgerton't",
                desc: "Everyone speaks in emojis only.",
                choices: [
                    { text: "📖 Use translator", outcome: "You understand! Episode works.", sanityDelta: 0, success: true },
                    { text: "🤷 Just nod", outcome: "You understand nothing. Brain hurts.", sanityDelta: -1, success: false }
                ]
            }
        ];

        // GAME STATE
        let sanity = 6;
        let bingeStreak = 0;
        let watchedCount = 0;
        let gameActive = true;
        let currentShow = null;

        function addLog(msg, isError = false) {
            let logDiv = document.getElementById("log");
            let p = document.createElement("p");
            p.innerHTML = msg;
            if (isError) p.style.color = "#ff6b9d";
            else if (msg.includes("✅")) p.style.color = "#a3e635";
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateUI() {
            document.getElementById("sanity").innerText = sanity;
            document.getElementById("streak").innerText = bingeStreak;
            document.getElementById("watchedCount").innerText = watchedCount;
            
            if (bingeStreak >= 4 && gameActive) {
                addLog("<span class='win'>🏆 YOU WIN! Binge Master! 🏆</span>");
                gameActive = false;
            }
            if (sanity <= 0 && gameActive) {
                addLog("<span class='lose'>💀 GAME OVER. You lost your sanity. 💀</span>");
                gameActive = false;
            }
        }

        function makeChoice(choice) {
            if (!gameActive) {
                addLog("Game over. Refresh to play again.", true);
                return;
            }
            if (!currentShow) {
                addLog("Pick a show first!", true);
                return;
            }

            sanity += choice.sanityDelta;
            if (sanity > 10) sanity = 10;
            if (sanity < 0) sanity = 0;
            
            addLog(`🌙 ${choice.outcome} (Sanity ${choice.sanityDelta >= 0 ? "+" : ""}${choice.sanityDelta})`);
            
            if (choice.success) {
                bingeStreak++;
                watchedCount++;
                addLog(`✅ Streak +1! (${bingeStreak}/4)`);
            } else {
                watchedCount++;
                addLog(`❌ No streak. Watched ${watchedCount} total.`);
            }
            
            currentShow = null;
            updateUI();
            renderShows();
        }

        function watchShow(show) {
            if (!gameActive) {
                addLog("Game over. Refresh to restart.", true);
                return;
            }
            currentShow = show;
            addLog(`🍿 NOW WATCHING: ${show.title} — ${show.desc}`);
            addLog(`📜 Your choices:`);
            renderShows();
        }

        function renderShows() {
            let container = document.getElementById("showList");
            container.innerHTML = "";
            
            // If watching a show, show choices
            if (currentShow && gameActive) {
                let div = document.createElement("div");
                div.className = "show-card";
                div.innerHTML = `
                    <div class="show-title">▶️ CURRENT: ${currentShow.title}</div>
                    <div>${currentShow.desc}</div>
                    <div style="margin-top: 10px;">👇 Make your choice:</div>
                `;
                currentShow.choices.forEach((choice, idx) => {
                    let btn = document.createElement("button");
                    btn.innerText = choice.text;
                    btn.onclick = () => makeChoice(choice);
                    div.appendChild(btn);
                });
                container.appendChild(div);
            }
            
            // Show available shows
            let header = document.createElement("h3");
            header.innerText = "📺 AVAILABLE SHOWS";
            container.appendChild(header);
            
            showsLibrary.forEach((show, idx) => {
                let card = document.createElement("div");
                card.className = "show-card";
                card.innerHTML = `
                    <div class="show-title">${show.title}</div>
                    <div>${show.desc}</div>
                    <button>🌙 WATCH</button>
                `;
                let btn = card.querySelector("button");
                btn.onclick = () => watchShow(show);
                container.appendChild(card);
            });
        }

        function addCustomShow() {
            let title = document.getElementById("newShowTitle").value.trim();
            let desc = document.getElementById("newShowDesc").value.trim();
            let choiceAText = document.getElementById("newShowChoiceA").value.trim();
            let outcomeA = document.getElementById("newOutcomeA").value.trim();
            let choiceBText = document.getElementById("newShowChoiceB").value.trim();
            let outcomeB = document.getElementById("newOutcomeB").value.trim();

            if (!title || !desc || !choiceAText || !outcomeA || !choiceBText || !outcomeB) {
                alert("Please fill all fields!");
                return;
            }

            let newShow = {
                title: title,
                desc: desc,
                choices: [
                    { text: choiceAText, outcome: outcomeA, sanityDelta: 0, success: true },
                    { text: choiceBText, outcome: outcomeB, sanityDelta: -1, success: false }
                ]
            };
            
            showsLibrary.push(newShow);
            addLog(`🌙 "${title}" added to NIGHTFLIX!`);
            
            // Clear inputs
            document.getElementById("newShowTitle").value = "";
            document.getElementById("newShowDesc").value = "";
            document.getElementById("newShowChoiceA").value = "";
            document.getElementById("newOutcomeA").value = "";
            document.getElementById("newShowChoiceB").value = "";
            document.getElementById("newOutcomeB").value = "";
            
            renderShows();
        }

        document.getElementById("addShowBtn").onclick = addCustomShow;
        renderShows();
        updateUI();
    </script>
</body>
</html>
