<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MAFIA STREETS - Roaming RPG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Monaco', monospace;
        }

        .game-wrapper {
            background: #1a1a2e;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 0 2px #ff444422;
        }

        .game-header h1 {
            text-align: center;
            color: #ff4444;
            text-shadow: 2px 2px 0 #660000;
            margin-bottom: 8px;
            letter-spacing: 3px;
        }

        .game-header p {
            text-align: center;
            color: #cccccc;
            font-size: 12px;
            margin-bottom: 15px;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 0 3px #2a2a3e, 0 0 0 6px #ff4444;
            cursor: crosshair;
            background: #2a2a2a;
        }

        .stats-panel {
            display: flex;
            justify-content: space-between;
            margin: 15px 10px 10px 10px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat {
            background: #0a0a1a;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
            color: #ffdd99;
            border-left: 4px solid #ff4444;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .controls-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 12px;
            font-size: 12px;
            background: #0a0a1a;
            padding: 8px;
            border-radius: 20px;
            color: #aaa;
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a1aee;
            backdrop-filter: blur(8px);
            padding: 30px 50px;
            border-radius: 30px;
            text-align: center;
            border: 2px solid #ff4444;
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        .game-over h2 {
            color: #ff6666;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .game-over p {
            color: white;
            font-size: 24px;
            margin: 15px 0;
        }

        .game-over button {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            font-family: monospace;
            transition: 0.2s;
        }

        .game-over button:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-header">
        <h1>🔫 MAFIA STREETS</h1>
        <p>WASD or Arrow Keys to move | SPACE or Click to attack</p>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="stats-panel">
        <div class="stat">❤️ Health: <span id="health">100</span></div>
        <div class="stat">💰 Money: <span id="money">0</span></div>
        <div class="stat">💀 Kills: <span id="kills">0</span></div>
        <div class="stat">🏆 Score: <span id="score">0</span></div>
    </div>
    <div class="controls-info">
        <span>🕹️ Move: WASD / Arrow Keys</span>
        <span>⚔️ Attack: SPACE or Mouse Click</span>
        <span>🔄 Restart: R key</span>
    </div>
    <div id="gameOverScreen" class="game-over hidden">
        <h2>💀 GAME OVER 💀</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">PLAY AGAIN</button>
    </div>
</div>

<script>
    (function(){
        // Wait for DOM to be fully loaded
        window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            
            // Game dimensions
            const W = 800, H = 600;
            
            // Player
            let player = {
                x: W/2, y: H/2, radius: 16, health: 100, maxHealth: 100,
                speed: 4, invincibleFrames: 0, attackCooldown: 0, attackRange: 45
            };
            
            // Game state
            let money = 0, kills = 0, score = 0, gameRunning = true;
            let enemies = [];
            let collectibles = [];
            let attackEffects = [];
            
            // Movement keys
            const keys = {
                ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
                w: false, s: false, a: false, d: false
            };
            
            let mouseX = player.x, mouseY = player.y;
            
            // Helper functions
            function random(min, max) { return Math.random() * (max - min) + min; }
            function distance(x1,y1,x2,y2) { return Math.hypot(x1-x2, y1-y2); }
            
            function spawnEnemy() {
                let side = Math.floor(random(0,4));
                let x,y;
                if(side===0) { x = random(30,W-30); y = -20; }
                else if(side===1) { x = W+20; y = random(30,H-30); }
                else if(side===2) { x = random(30,W-30); y = H+20; }
                else { x = -20; y = random(30,H-30); }
                enemies.push({
                    x, y, radius: 14, health: 30, maxHealth: 30,
                    speed: 1.2, damage: 10, color: '#aa3333'
                });
            }
            
            function spawnMoney(x,y) {
                collectibles.push({ x, y, radius: 8, value: Math.floor(random(10,30)) });
            }
            
            function attack(targetX, targetY) {
                if(!gameRunning || player.attackCooldown>0) return;
                let dx = targetX - player.x, dy = targetY - player.y;
                let len = Math.hypot(dx,dy);
                if(len<0.01) len=1;
                let dirX = dx/len, dirY = dy/len;
                attackEffects.push({ x: player.x+dirX*22, y: player.y+dirY*22, radius:18, life:8 });
                
                let hit = false;
                for(let i=0; i<enemies.length; i++) {
                    let e = enemies[i];
                    if(distance(player.x,player.y, e.x,e.y) < player.attackRange + e.radius) {
                        e.health -= 25;
                        hit = true;
                        if(e.health <= 0) {
                            spawnMoney(e.x,e.y);
                            enemies.splice(i,1);
                            kills++;
                            score += 50;
                            i--;
                        }
                    }
                }
                if(hit) score += 5;
                player.attackCooldown = 18;
            }
            
            function update() {
                if(!gameRunning) return;
                if(player.invincibleFrames>0) player.invincibleFrames--;
                if(player.attackCooldown>0) player.attackCooldown--;
                
                let moveX=0, moveY=0;
                if(keys.ArrowUp||keys.w) moveY-=1;
                if(keys.ArrowDown||keys.s) moveY+=1;
                if(keys.ArrowLeft||keys.a) moveX-=1;
                if(keys.ArrowRight||keys.d) moveX+=1;
                if(moveX!==0 || moveY!==0) {
                    let len = Math.hypot(moveX,moveY);
                    moveX = moveX/len * player.speed;
                    moveY = moveY/len * player.speed;
                }
                let newX = player.x+moveX, newY = player.y+moveY;
                player.x = Math.min(Math.max(newX, player.radius+5), W-player.radius-5);
                player.y = Math.min(Math.max(newY, player.radius+5), H-player.radius-5);
                
                // enemies chase
                for(let i=0; i<enemies.length; i++) {
                    let e = enemies[i];
                    let dx = player.x - e.x, dy = player.y - e.y;
                    let dist = Math.hypot(dx,dy);
                    if(dist>0.1) {
                        e.x += (dx/dist)*e.speed;
                        e.y += (dy/dist)*e.speed;
                    }
                    e.x = Math.min(Math.max(e.x,10), W-10);
                    e.y = Math.min(Math.max(e.y,10), H-10);
                    if(distance(player.x,player.y, e.x,e.y) < player.radius+e.radius) {
                        if(player.invincibleFrames<=0 && gameRunning) {
                            player.health -= e.damage;
                            player.invincibleFrames = 25;
                            if(player.health<=0) {
                                player.health=0;
                                gameRunning=false;
                                document.getElementById('finalScore').innerText = Math.floor(score);
                                document.getElementById('gameOverScreen').classList.remove('hidden');
                            }
                        }
                    }
                }
                
                // collect money
                for(let i=0; i<collectibles.length; i++) {
                    let c = collectibles[i];
                    if(distance(player.x,player.y, c.x,c.y) < player.radius+c.radius) {
                        money += c.value;
                        score += c.value;
                        collectibles.splice(i,1);
                        i--;
                    }
                }
                
                // spawn enemies
                let target = 4 + Math.floor(kills/8);
                if(enemies.length < target && enemies.length < 15 && Math.random()<0.02) spawnEnemy();
                
                // UI update
                document.getElementById('health').innerHTML = Math.max(0,player.health);
                document.getElementById('money').innerHTML = Math.floor(money);
                document.getElementById('kills').innerHTML = kills;
                document.getElementById('score').innerHTML = Math.floor(score);
                
                // effects fade
                for(let i=0;i<attackEffects.length;i++) {
                    attackEffects[i].life--;
                    if(attackEffects[i].life<=0) { attackEffects.splice(i,1); i--; }
                }
            }
            
            function draw() {
                ctx.clearRect(0,0,W,H);
                // grid
                ctx.strokeStyle = '#333355';
                ctx.lineWidth = 0.5;
                for(let i=0;i<W+50;i+=50) {
                    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,H); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0,i%H); ctx.lineTo(W,i%H); ctx.stroke();
                }
                // money
                for(let c of collectibles) {
                    ctx.beginPath();
                    ctx.arc(c.x,c.y,c.radius,0,Math.PI*2);
                    ctx.fillStyle = '#ffcc44';
                    ctx.fill();
                    ctx.fillStyle = '#aa8833';
                    ctx.font = 'bold 14px monospace';
                    ctx.fillText('💰', c.x-9, c.y+5);
                }
                // enemies
                for(let e of enemies) {
                    ctx.beginPath();
                    ctx.arc(e.x,e.y,e.radius,0,Math.PI*2);
                    ctx.fillStyle = e.color;
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 16px monospace';
                    ctx.fillText('👿', e.x-10, e.y+7);
                    let hpPercent = e.health/e.maxHealth;
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(e.x-15, e.y-18, 30, 5);
                    ctx.fillStyle = '#00ff00';
                    ctx.fillRect(e.x-15, e.y-18, 30*hpPercent, 5);
                }
                // player
                ctx.beginPath();
                ctx.arc(player.x,player.y,player.radius,0,Math.PI*2);
                ctx.fillStyle = '#2a6f8f';
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '24px monospace';
                ctx.fillText('🕴️', player.x-14, player.y+10);
                if(player.invincibleFrames>0 && (Math.floor(Date.now()/50)%2===0)) {
                    ctx.beginPath();
                    ctx.arc(player.x,player.y,player.radius+3,0,Math.PI*2);
                    ctx.fillStyle = '#ffffffaa';
                    ctx.fill();
                }
                // attack effects
                for(let a of attackEffects) {
                    ctx.beginPath();
                    ctx.arc(a.x,a.y,a.radius,0,Math.PI*2);
                    ctx.fillStyle = `rgba(255,100,0,${a.life/10})`;
                    ctx.fill();
                }
                // attack range
                ctx.beginPath();
                ctx.arc(player.x,player.y,player.attackRange,0,Math.PI*2);
                ctx.strokeStyle = player.attackCooldown>0 ? '#ff8844' : '#ff884488';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                // direction line
                let dx = mouseX - player.x, dy = mouseY - player.y;
                let angle = Math.atan2(dy,dx);
                let tipX = player.x + Math.cos(angle)*player.attackRange;
                let tipY = player.y + Math.sin(angle)*player.attackRange;
                ctx.beginPath();
                ctx.moveTo(player.x,player.y);
                ctx.lineTo(tipX,tipY);
                ctx.strokeStyle = '#ffaa55';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }
            
            // Event handlers
            function handleKeyDown(e) {
                let key = e.key;
                if(keys.hasOwnProperty(key)) { keys[key]=true; e.preventDefault(); }
                if(key===' ' || key==='Space') { e.preventDefault(); attack(mouseX,mouseY); }
                if(key==='r'||key==='R') restartGame();
            }
            function handleKeyUp(e) {
                let key = e.key;
                if(keys.hasOwnProperty(key)) { keys[key]=false; e.preventDefault(); }
            }
            function handleMouseMove(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let cx = (e.clientX - rect.left) * scaleX;
                let cy = (e.clientY - rect.top) * scaleY;
                mouseX = Math.min(Math.max(cx,0),W);
                mouseY = Math.min(Math.max(cy,0),H);
            }
            function handleCanvasClick(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let cx = (e.clientX - rect.left) * scaleX;
                let cy = (e.clientY - rect.top) * scaleY;
                attack(cx,cy);
            }
            
            window.restartGame = function() {
                player = {
                    x: W/2, y: H/2, radius:16, health:100, maxHealth:100,
                    speed:4, invincibleFrames:0, attackCooldown:0, attackRange:45
                };
                money = 0; kills = 0; score = 0; gameRunning = true;
                enemies = [];
                collectibles = [];
                attackEffects = [];
                for(let i=0;i<3;i++) spawnEnemy();
                document.getElementById('gameOverScreen').classList.add('hidden');
                document.getElementById('health').innerHTML = 100;
                document.getElementById('money').innerHTML = 0;
                document.getElementById('kills').innerHTML = 0;
                document.getElementById('score').innerHTML = 0;
            };
            
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            canvas.addEventListener('mousemove', handleMouseMove);
            canvas.addEventListener('click', handleCanvasClick);
            
            // start
            restartGame();
            gameLoop();
        });
    })();
</script>
</body>
</html>
