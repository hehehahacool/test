<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTFLIX – AI-Generated Knockoff Streaming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Netflix Sans', sans-serif;
        }

        .navbar {
            background: linear-gradient(180deg, #0a0a0f 0%, #0a0a0f 95%, transparent 100%);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #c084fc, #6a0dad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #c084fc;
        }

        .main-content {
            padding-top: 80px;
            padding-bottom: 2rem;
        }

        .player-section {
            background: #000;
            margin: 0 2rem 2rem 2rem;
            border-radius: 16px;
            overflow: hidden;
            display: none;
        }

        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
        }

        .video-info {
            padding: 1rem;
            background: linear-gradient(0deg, #0a0a0f, #1a1a2e);
        }

        .video-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #c084fc;
        }

        .row {
            margin: 2rem;
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .row-title {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .show-list {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        .show-list::-webkit-scrollbar {
            height: 8px;
        }

        .show-list::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 10px;
        }

        .show-list::-webkit-scrollbar-thumb {
            background: #c084fc;
            border-radius: 10px;
        }

        .show-card {
            min-width: 200px;
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .show-card:hover {
            transform: scale(1.05);
        }

        .show-thumb {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #2a1a4a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .show-title-card {
            padding: 0.5rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .badge {
            font-size: 0.7rem;
            background: #c084fc33;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 5px;
        }

        .upload-section {
            margin: 2rem;
            padding: 1.5rem;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px dashed #c084fc;
        }

        .upload-section h3 {
            color: #c084fc;
            margin-bottom: 1rem;
        }

        input, button {
            padding: 0.6rem 1rem;
            margin: 0.3rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }

        input {
            background: #2a2a3e;
            color: white;
            flex: 1;
        }

        button {
            background: #6a0dad;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #c084fc;
        }

        .upload-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🌙 NIGHTFLIX</div>
        <div class="nav-links">
            <a onclick="showAllShows()">🏠 Home</a>
            <a onclick="showMyShows()">📁 My Uploads</a>
        </div>
    </div>

    <div class="main-content">
        <div class="player-section" id="playerSection">
            <video id="videoPlayer" controls>
                <source id="videoSource" src="">
                Your browser does not support video.
            </video>
            <div class="video-info">
                <div class="video-title" id="currentVideoTitle">Now Playing</div>
                <div id="currentVideoDesc" style="color: #aaa; margin-top: 0.5rem;"></div>
            </div>
        </div>

        <div class="row" id="defaultRow">
            <div class="row-header">
                <div class="row-title">🤖 AI-GENERATED KNOCKOFFS <span class="badge">watch at your own risk</span></div>
            </div>
            <div class="show-list" id="defaultShowsList"></div>
        </div>

        <div class="row" id="uploadedRow">
            <div class="row-header">
                <div class="row-title">📁 YOUR UPLOADS</div>
            </div>
            <div class="show-list" id="uploadedShowsList"></div>
        </div>

        <div class="upload-section">
            <h3>➕ ADD YOUR OWN KNOCKOFF</h3>
            <div class="upload-row">
                <input type="text" id="videoTitle" placeholder="Knockoff title (e.g. 'The Mandalorian't')">
                <input type="text" id="videoDesc" placeholder="Description">
            </div>
            <div class="upload-row">
                <input type="file" id="videoFile" accept="video/mp4,video/webm">
                <span style="color:#888;">or</span>
                <input type="text" id="videoUrl" placeholder="Paste video URL (mp4)">
            </div>
            <button onclick="addVideo()">🌙 ADD TO NIGHTFLIX</button>
        </div>

        <div class="footer">
            <p>🌙 NIGHTFLIX — "Stream after dark. Regret by dawn."</p>
            <p>All videos are real and working. The shows are fake. That's the joke.</p>
        </div>
    </div>

    <script>
        // ===== REAL WORKING VIDEOS with FAKE AI-GENERATED SHOW NAMES =====
        let userVideos = [];

        function loadUserVideos() {
            const saved = localStorage.getItem('nightflix_user_videos');
            if (saved) {
                try {
                    userVideos = JSON.parse(saved);
                } catch(e) { userVideos = []; }
            }
        }

        function saveUserVideos() {
            localStorage.setItem('nightflix_user_videos', JSON.stringify(userVideos));
        }

        // REAL WORKING VIDEOS + FAKE AI KNOCKOFF NAMES
        const fakeShows = [
            {
                id: 'ai1',
                title: 'Stranger Things But The Demogorgon Is Just A Tired Dad',
                desc: 'AI generated: A sleepy father in a gray robe haunts the kids of Hawkins',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                emoji: '👨‍💤'
            },
            {
                id: 'ai2',
                title: 'The Crown\'t: Monarch Who Forgot Wi-Fi Password',
                desc: 'AI generated: Queen Elizabeth tries to reset the router for 47 minutes',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                emoji: '👑📶'
            },
            {
                id: 'ai3',
                title: 'The Mandalorian\'t: Bounty Hunter With A Kitchen Strainer',
                desc: 'AI generated: This is not the way. This is just embarrassing.',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                emoji: '🥣'
            },
            {
                id: 'ai4',
                title: 'Squid Game But Everyone Is Just Mildly Inconvenienced',
                desc: 'AI generated: Red light, green light but you just have to wait 3 extra seconds',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunrides.mp4',
                emoji: '🦑😐'
            },
            {
                id: 'ai5',
                title: 'Bridgerton\'t: Everyone Speaks Only In Emojis',
                desc: 'AI generated: "👑❤️🐝" somehow counts as dialogue',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4',
                emoji: '👑🤔'
            },
            {
                id: 'ai6',
                title: 'Wednesday\'t: She\'s Just Mildly Annoyed',
                desc: 'AI generated: No murder. Just sighing and rolling eyes for 8 episodes',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WhatCar.mp4',
                emoji: '🙄'
            },
            {
                id: 'ai7',
                title: 'The Last of Us\'t: Fungus That Just Makes You Sneeze',
                desc: 'AI generated: Post-apocalyptic allergy season',
                src: 'https://download.blender.org/peach/trailer/trailer_400p.ogg',
                emoji: '🤧🍄'
            },
            {
                id: 'ai8',
                title: 'House of the Dragon\'t: Medieval Candle-Measuring Contest',
                desc: 'AI generated: Who has the biggest, shiniest candle? Riveting.',
                src: 'https://download.blender.org/sintel/sintel_trailer-1080p.mp4',
                emoji: '🕯️👑'
            }
        ];

        let currentFilter = 'all';

        function playVideo(video) {
            const videoPlayer = document.getElementById('videoPlayer');
            const videoSource = document.getElementById('videoSource');
            const playerSection = document.getElementById('playerSection');
            const currentTitle = document.getElementById('currentVideoTitle');
            const currentDesc = document.getElementById('currentVideoDesc');

            videoSource.src = video.src;
            videoPlayer.load();
            currentTitle.innerText = video.title;
            currentDesc.innerText = video.desc;
            playerSection.style.display = 'block';
            
            videoPlayer.play().catch(e => console.log('Click play to start'));
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function renderShows(containerId, shows) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (shows.length === 0) {
                container.innerHTML = '<div style="color:#666; text-align:center; padding:1rem;">✨ No knockoffs yet. Add your own above!</div>';
                return;
            }

            shows.forEach(show => {
                const card = document.createElement('div');
                card.className = 'show-card';
                card.onclick = () => playVideo(show);
                
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'show-thumb';
                thumbDiv.innerHTML = show.emoji || '🎬';
                thumbDiv.style.fontSize = '3rem';
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'show-title-card';
                titleDiv.innerText = show.title.length > 35 ? show.title.slice(0,35)+'...' : show.title;
                
                card.appendChild(thumbDiv);
                card.appendChild(titleDiv);
                container.appendChild(card);
            });
        }

        function renderAllShows() {
            renderShows('defaultShowsList', fakeShows);
            renderShows('uploadedShowsList', userVideos);
            
            if (currentFilter === 'my') {
                document.getElementById('defaultRow').style.display = 'none';
                document.getElementById('uploadedRow').style.display = 'block';
            } else {
                document.getElementById('defaultRow').style.display = 'block';
                document.getElementById('uploadedRow').style.display = 'block';
            }
        }

        function showAllShows() {
            currentFilter = 'all';
            renderAllShows();
        }

        function showMyShows() {
            currentFilter = 'my';
            renderAllShows();
        }

        function addVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const desc = document.getElementById('videoDesc').value.trim();
            const fileInput = document.getElementById('videoFile');
            const urlInput = document.getElementById('videoUrl').value.trim();

            if (!title) {
                alert('Enter a knockoff title!');
                return;
            }

            if (!fileInput.files[0] && !urlInput) {
                alert('Upload a video file or paste a URL');
                return;
            }

            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    userVideos.push({
                        id: Date.now(),
                        title: title,
                        desc: desc || 'Your custom knockoff',
                        src: e.target.result,
                        emoji: '📹',
                        isUser: true
                    });
                    saveUserVideos();
                    renderAllShows();
                    clearForm();
                    alert('✅ Knockoff added!');
                };
                reader.readAsDataURL(file);
            } else if (urlInput) {
                userVideos.push({
                    id: Date.now(),
                    title: title,
                    desc: desc || 'Your custom knockoff',
                    src: urlInput,
                    emoji: '🔗',
                    isUser: true
                });
                saveUserVideos();
                renderAllShows();
                clearForm();
                alert('✅ Knockoff URL added!');
            }
        }

        function clearForm() {
            document.getElementById('videoTitle').value = '';
            document.getElementById('videoDesc').value = '';
            document.getElementById('videoFile').value = '';
            document.getElementById('videoUrl').value = '';
        }

        loadUserVideos();
        renderAllShows();

        window.addVideo = addVideo;
        window.showAllShows = showAllShows;
        window.showMyShows = showMyShows;
        window.playVideo = playVideo;
    </script>
</body>
</html>
