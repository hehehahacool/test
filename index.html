<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIGHTFLIX – Stream After Dark</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Netflix Sans', sans-serif;
        }

        /* Header */
        .navbar {
            background: linear-gradient(180deg, #0a0a0f 0%, #0a0a0f 95%, transparent 100%);
            padding: 1rem 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(135deg, #c084fc, #6a0dad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Main */
        .main-content {
            padding-top: 80px;
            padding-bottom: 2rem;
            min-height: 100vh;
        }

        /* Video Player Section */
        .player-section {
            background: #000;
            margin: 0 2rem 2rem 2rem;
            border-radius: 16px;
            overflow: hidden;
        }

        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
        }

        .video-info {
            padding: 1rem;
            background: linear-gradient(0deg, #0a0a0f, #1a1a2e);
        }

        .video-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #c084fc;
        }

        /* Show Rows */
        .row {
            margin: 2rem;
        }

        .row-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
        }

        .row-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e0e0e0;
        }

        .show-list {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
        }

        .show-list::-webkit-scrollbar {
            height: 8px;
        }

        .show-list::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 10px;
        }

        .show-list::-webkit-scrollbar-thumb {
            background: #c084fc;
            border-radius: 10px;
        }

        .show-card {
            min-width: 200px;
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .show-card:hover {
            transform: scale(1.05);
        }

        .show-thumb {
            width: 100%;
            height: 120px;
            background: #2a2a3e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .show-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .show-title-card {
            padding: 0.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Upload Section */
        .upload-section {
            margin: 2rem;
            padding: 1.5rem;
            background: #1a1a2e;
            border-radius: 16px;
            border: 1px dashed #c084fc;
        }

        .upload-section h3 {
            color: #c084fc;
            margin-bottom: 1rem;
        }

        input, button {
            padding: 0.6rem 1rem;
            margin: 0.3rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }

        input {
            background: #2a2a3e;
            color: white;
            flex: 1;
        }

        button {
            background: #6a0dad;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #c084fc;
        }

        .upload-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }

        /* Empty state */
        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #888;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">🌙 NIGHTFLIX</div>
        <div class="nav-links">
            <a onclick="filterShows('all')">🏠 Home</a>
            <a onclick="filterShows('uploaded')">📁 My Uploads</a>
        </div>
    </div>

    <div class="main-content">
        <!-- Video Player -->
        <div class="player-section" id="playerSection" style="display: none;">
            <video id="videoPlayer" controls autoplay>
                <source id="videoSource" src="">
                Your browser does not support video.
            </video>
            <div class="video-info">
                <div class="video-title" id="currentVideoTitle">Now Playing</div>
                <div id="currentVideoDesc" style="color: #aaa; margin-top: 0.5rem;"></div>
            </div>
        </div>

        <!-- Default Shows Row -->
        <div class="row" id="defaultRow">
            <div class="row-header">
                <div class="row-title">🌙 NIGHTFLIX ORIGINALS</div>
            </div>
            <div class="show-list" id="defaultShowsList"></div>
        </div>

        <!-- Uploaded Shows Row -->
        <div class="row" id="uploadedRow">
            <div class="row-header">
                <div class="row-title">📁 YOUR UPLOADS</div>
            </div>
            <div class="show-list" id="uploadedShowsList"></div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h3>➕ ADD YOUR OWN VIDEO</h3>
            <div class="upload-row">
                <input type="text" id="videoTitle" placeholder="Video Title (e.g. 'My Cool Movie')">
                <input type="text" id="videoDesc" placeholder="Description">
            </div>
            <div class="upload-row">
                <input type="file" id="videoFile" accept="video/mp4,video/webm,video/ogg">
                <span style="color: #888;">or paste URL:</span>
                <input type="text" id="videoUrl" placeholder="https://example.com/video.mp4">
            </div>
            <div class="upload-row">
                <input type="text" id="thumbnailUrl" placeholder="Thumbnail URL (optional)">
                <button onclick="addVideo()">🌙 ADD TO NIGHTFLIX</button>
            </div>
            <p style="font-size: 0.7rem; color: #666; margin-top: 0.5rem;">Supports: MP4, WebM, OGV | Max 100MB for uploads</p>
        </div>

        <div class="footer">
            <p>NIGHTFLIX — Stream after dark. Regret by dawn.</p>
            <p>Upload your own videos to watch them here!</p>
        </div>
    </div>

    <script>
        // Video database
        let videoLibrary = [];
        let currentFilter = 'all';

        // Default sample videos (public domain / test videos)
        const defaultVideos = [
            {
                id: 'default1',
                title: '🌊 Big Buck Bunny (Sample)',
                desc: 'A classic open-source animation',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                thumbnail: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg',
                isDefault: true
            },
            {
                id: 'default2',
                title: '🔥 For Bigger Blazes',
                desc: 'Action-packed test video',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4',
                thumbnail: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerBlazes.jpg',
                isDefault: true
            },
            {
                id: 'default3',
                title: '🎬 For Bigger Escapes',
                desc: 'Adventure awaits',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4',
                thumbnail: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerEscapes.jpg',
                isDefault: true
            },
            {
                id: 'default4',
                title: '🎥 For Bigger Fun',
                desc: 'Short and fun',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFunrides.mp4',
                thumbnail: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerFunrides.jpg',
                isDefault: true
            },
            {
                id: 'default5',
                title: '🎮 Subaru Outback',
                desc: 'Commercial test',
                src: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4',
                thumbnail: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/images/SubaruOutbackOnStreetAndDirt.jpg',
                isDefault: true
            }
        ];

        // Load saved videos from localStorage
        function loadSavedVideos() {
            const saved = localStorage.getItem('nightflix_videos');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    videoLibrary = parsed.filter(v => !v.isDefault);
                } catch(e) {}
            }
        }

        function saveVideos() {
            const toSave = videoLibrary.filter(v => !v.isDefault);
            localStorage.setItem('nightflix_videos', JSON.stringify(toSave));
        }

        function addVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const desc = document.getElementById('videoDesc').value.trim();
            const fileInput = document.getElementById('videoFile');
            const urlInput = document.getElementById('videoUrl').value.trim();
            const thumbnail = document.getElementById('thumbnailUrl').value.trim();

            if (!title) {
                alert('Please enter a video title');
                return;
            }

            if (!fileInput.files[0] && !urlInput) {
                alert('Please select a video file OR paste a video URL');
                return;
            }

            if (fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const newVideo = {
                        id: Date.now(),
                        title: title,
                        desc: desc || 'No description',
                        src: e.target.result,
                        thumbnail: thumbnail || null,
                        isDefault: false,
                        isUpload: true
                    };
                    videoLibrary.push(newVideo);
                    saveVideos();
                    renderAllShows();
                    document.getElementById('videoTitle').value = '';
                    document.getElementById('videoDesc').value = '';
                    document.getElementById('videoUrl').value = '';
                    document.getElementById('thumbnailUrl').value = '';
                    fileInput.value = '';
                    alert('✅ Video added! Find it in "Your Uploads"');
                };
                reader.readAsDataURL(file);
            } else if (urlInput) {
                const newVideo = {
                    id: Date.now(),
                    title: title,
                    desc: desc || 'No description',
                    src: urlInput,
                    thumbnail: thumbnail || null,
                    isDefault: false,
                    isUpload: true
                };
                videoLibrary.push(newVideo);
                saveVideos();
                renderAllShows();
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoDesc').value = '';
                document.getElementById('videoUrl').value = '';
                document.getElementById('thumbnailUrl').value = '';
                alert('✅ Video URL added!');
            }
        }

        function playVideo(video) {
            const videoPlayer = document.getElementById('videoPlayer');
            const videoSource = document.getElementById('videoSource');
            const playerSection = document.getElementById('playerSection');
            const currentTitle = document.getElementById('currentVideoTitle');
            const currentDesc = document.getElementById('currentVideoDesc');

            videoSource.src = video.src;
            videoPlayer.load();
            currentTitle.innerText = video.title;
            currentDesc.innerText = video.desc || 'Now streaming on NIGHTFLIX';
            playerSection.style.display = 'block';
            
            // Scroll to player
            playerSection.scrollIntoView({ behavior: 'smooth' });
        }

        function renderShows(containerId, shows, rowTitle) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            if (shows.length === 0) {
                container.innerHTML = '<div class="empty-message">✨ No shows yet. Upload your own videos above!</div>';
                return;
            }

            shows.forEach(show => {
                const card = document.createElement('div');
                card.className = 'show-card';
                card.onclick = () => playVideo(show);
                
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'show-thumb';
                if (show.thumbnail) {
                    thumbDiv.innerHTML = `<img src="${show.thumbnail}" alt="${show.title}">`;
                } else {
                    thumbDiv.innerHTML = '🎬';
                }
                
                const titleDiv = document.createElement('div');
                titleDiv.className = 'show-title-card';
                titleDiv.innerText = show.title.length > 20 ? show.title.slice(0,20)+'...' : show.title;
                
                card.appendChild(thumbDiv);
                card.appendChild(titleDiv);
                container.appendChild(card);
            });
        }

        function renderAllShows() {
            // Default shows
            renderShows('defaultShowsList', defaultVideos, 'NIGHTFLIX ORIGINALS');
            
            // Uploaded shows
            const uploaded = videoLibrary.filter(v => !v.isDefault);
            renderShows('uploadedShowsList', uploaded, 'YOUR UPLOADS');
            
            // Handle row visibility based on filter
            if (currentFilter === 'uploaded') {
                document.getElementById('defaultRow').style.display = 'none';
                document.getElementById('uploadedRow').style.display = 'block';
            } else {
                document.getElementById('defaultRow').style.display = 'block';
                document.getElementById('uploadedRow').style.display = 'block';
            }
        }

        function filterShows(type) {
            currentFilter = type;
            renderAllShows();
        }

        // Initialize
        loadSavedVideos();
        renderAllShows();

        // Make functions global
        window.addVideo = addVideo;
        window.filterShows = filterShows;
        window.playVideo = playVideo;
    </script>
</body>
</html>
