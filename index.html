<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MAFIA STREETS - Roaming RPG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="game-header">
            <h1>🔫 MAFIA STREETS</h1>
            <p>WASD or Arrow Keys to move | SPACE or Click to attack</p>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="stats-panel">
            <div class="stat">❤️ Health: <span id="health">100</span></div>
            <div class="stat">💰 Money: <span id="money">0</span></div>
            <div class="stat">💀 Kills: <span id="kills">0</span></div>
            <div class="stat">🏆 Score: <span id="score">0</span></div>
        </div>
        <div class="controls-info">
            <span>🕹️ Move: WASD / Arrow Keys</span>
            <span>⚔️ Attack: SPACE or Mouse Click</span>
            <span>🔄 Restart: R key</span>
        </div>
        <div id="gameOverScreen" class="game-over hidden">
            <h2>💀 GAME OVER 💀</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
